<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <main class="app">
      <h1>Weather App</h1>
      <form class="search-form">
        <label for="location">Location</label>
        <input
          type="text"
          name="location"
          id="location"
          placeholder="Phoenix, London, Tokyo..."
        />
        <button class="submit-btn" type="submit">Search</button>
        <button class="unit-toggle" type="button"></button>
      </form>
      <section class="status-message" aria-live="polite"></section>
      <section class="weather-display" aria-label="Current weather"></section>
      <section class="forecast-display" aria-label="Weather forecast"></section>
    </main>
  </body>
</html>
